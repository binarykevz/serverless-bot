name = "kevin-companion"
main = "src/index.ts"
compatibility_date = "2025-01-01"
nodejs_compat = true

[vars]
AI_ROUTER_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free"
IMAGE_API_URL = "https://media-api.markmykevin.workers.dev/api/images/random?limit=1"
VIP_USER_IDS = "6076887662,6895315219"

# Secrets you still need to set via `npx wrangler secret put`:
# TELEGRAM_BOT_TOKEN
# TURSO_DB_URL
# TURSO_AUTH_TOKEN
# WEBHOOK_SECRET

[[services]]
binding = "MEDIA_API"
service = "media-api"
