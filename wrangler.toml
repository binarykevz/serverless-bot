name = "kevin-companion"
main = "src/index.ts"
compatibility_date = "2025-01-01"
nodejs_compat = true

[vars]
AI_ROUTER_MODEL = "liquid/lfm-2.5-2.6b:free"
IMAGE_API_URL = "https://media-api.markmykevin.workers.dev/api/images/random?limit=1"
VIP_USER_IDS = "YOUR_TELEGRAM_USER_ID"

# Secrets you still need to set via `npx wrangler secret put`:
# TELEGRAM_BOT_TOKEN
# TURSO_DB_URL
# TURSO_AUTH_TOKEN
# WEBHOOK_SECRET

[[services]]
binding = "MEDIA_API"
service = "media-api"
