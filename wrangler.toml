name = "kevin-companion"
main = "src/index.ts"
compatibility_date = "2024-09-25"
nodejs_compat = true

[vars]
# Non-secret variables
GEMINI_MODEL = "gemini-2.5-flash"
IMAGE_API_URL = "https://media-api.markmykevin.workers.dev//api/images/random?limit=1"

# Secrets (set these via `wrangler secret put`)
# TELEGRAM_BOT_TOKEN
# GEMINI_API_KEY
# TURSO_DB_URL
# TURSO_AUTH_TOKEN
# WEBHOOK_SECRET
